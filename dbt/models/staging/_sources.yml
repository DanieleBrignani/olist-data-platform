version: 2

# No `freshness:` block, deliberately. dbt source freshness compares a loaded_at column to
# now(); Olist is a static 2016-2018 extract, so every freshness check would fail forever and
# teach people to ignore it. What is monitored instead: time since the last successful
# publication (Prometheus `dataset_freshness_seconds`, alert OlistDatasetStale), with the
# business-event horizon exposed separately (docs/observability.md).

sources:
  - name: src
    description: >
      Typed, contract-conforming source tables built by `olist stage` (load_staging).
      Records violating ERROR rules are already quarantined in meta.rejected_records;
      WARNING records are present and flagged there.
    schema: src
    tables:
      - name: customers
      - name: orders
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: products
      - name: sellers
      - name: geolocation
      - name: product_category_translation
