[project]
name = "olist-platform"
version = "0.1.0"
description = "Production-oriented analytical data platform for the Olist Brazilian E-Commerce dataset"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "psycopg[binary]>=3.2,<3.4",
    "alembic>=1.13,<1.21",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.7,<3",
    "dbt-core>=1.10,<1.13",
    "dbt-postgres>=1.9,<1.12",
    "prefect==3.8.6",
    "prometheus-client>=0.20",
]

[project.scripts]
olist = "olist_platform.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_platform", "orchestration"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", # explicit args on pipeline functions are intentional
    "PLR0917",
]

[tool.ruff.lint.isort]
known-first-party = ["olist_platform", "orchestration", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S608"]
# SQL compiler: identifiers come only from regex-validated contracts, values go through lit()
"src/olist_platform/database/staging.py" = ["S608"]
# relation names from the dbt manifest / fixed schema names, never user input
"src/olist_platform/quality/gate.py" = ["S608"]
"src/olist_platform/database/publish.py" = ["S608"]
"src/olist_platform/database/fingerprint.py" = ["S608"]
# benchmark/explain scripts inline data-derived hex ids and fixed table names
"scripts/**" = ["S608"]
"migrations/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL (docker compose)",
    "e2e: runs the full pipeline against the real dataset",
    "source_data: requires the downloaded Olist files in data/raw",
]
